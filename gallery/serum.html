<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Kesar &amp; Co. · Vitamin C Serum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #f7eedd; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #3b1d10; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; }

  .card { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: radial-gradient(500px 400px at 10% 95%, rgba(242,178,92,.25), rgba(247,238,221,0) 70%), linear-gradient(180deg, #fbf5ea 0%, #f5e8d0 100%); }
  .frame { position: absolute; inset: 36px; border: 1.5px solid rgba(156,86,24,.35); border-radius: 6px; z-index: 3; pointer-events: none; }

  /* saffron panel on the right */
  .panel { position: absolute; top: 0; right: 0; bottom: 0; width: 500px;
    background: radial-gradient(520px 520px at 50% 52%, #f7b85e 0%, #e98f2e 45%, #c8611a 100%); }
  .panel::before { content: ""; position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; margin: -230px 0 0 -200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,232,190,.75), rgba(255,232,190,0) 70%); }
  .panel::after { content: ""; position: absolute; left: 50%; top: 50%; width: 440px; height: 440px; margin: -250px 0 0 -220px; border-radius: 50%; border: 1.5px solid rgba(255,240,215,.45); }

  /* top bar */
  .top { position: absolute; top: 78px; left: 92px; display: flex; align-items: center; gap: 14px; font-size: 22px; letter-spacing: .32em; font-weight: 600; color: #4a2412; z-index: 2; }
  .top .amp { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: 0; color: #c8691a; font-size: 28px; margin: 0 -4px; }
  .mark { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f7b956, #d8701a 60%, #9b4610); box-shadow: 0 2px 6px rgba(120,55,10,.3); position: relative; }
  .mark::after { content: ""; position: absolute; left: 15px; top: 7px; width: 4px; height: 20px; border-radius: 3px; background: #fbefd9; transform: rotate(18deg); opacity: .9; }

  /* copy */
  .copy { position: absolute; left: 92px; top: 248px; width: 470px; z-index: 2; }
  .badge { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px 11px 16px; border-radius: 999px; background: #3b1d10; color: #fbefd9;
    font-size: 15px; letter-spacing: .26em; text-transform: uppercase; font-weight: 700; }
  .badge .star { color: #f0a23f; font-size: 18px; letter-spacing: 0; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 104px; line-height: .95; margin-top: 34px; letter-spacing: -.02em; font-variation-settings: "opsz" 144; }
  h1 em { font-style: italic; color: #c8611a; }
  .sub { font-size: 22px; line-height: 1.5; color: #6b4430; margin-top: 26px; width: 400px; }
  .rule { width: 64px; height: 2px; background: #d8731c; margin: 40px 0 30px; }
  .price { display: flex; align-items: baseline; gap: 22px; }
  .was { font-size: 38px; color: #9a7a66; text-decoration: line-through; text-decoration-color: #c8611a; text-decoration-thickness: 3px; font-weight: 400; }
  .now { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 124px; line-height: .9; color: #3b1d10; letter-spacing: -.03em; font-variation-settings: "opsz" 144; }
  .now .r { font-weight: 400; font-size: 76px; margin-right: 4px; vertical-align: 26px; color: #c8611a; }
  .save { display: inline-block; margin-top: 22px; padding: 10px 18px; border: 1.5px solid #c8611a; border-radius: 6px; color: #b4561a; font-size: 17px; letter-spacing: .24em; font-weight: 700; text-transform: uppercase; }

  .foot { position: absolute; left: 92px; bottom: 82px; font-size: 16px; letter-spacing: .3em; text-transform: uppercase; color: #9b5418; font-weight: 600; z-index: 2; }
  .foot b { color: #3b1d10; }

  /* product (drawn at 1x, scaled up as a group) */
  .product { position: absolute; left: 790px; top: 560px; width: 0; height: 0; transform: scale(1.75); }
  .shadow { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(70,25,0,.55), rgba(70,25,0,0) 70%); filter: blur(4px); }
  .bottle { position: absolute; width: 150px; height: 240px; border-radius: 26px 26px 30px 30px;
    background: linear-gradient(90deg, #6a2c07 0%, #a54c10 12%, #d9761f 30%, #f3aa52 42%, #e48a2c 52%, #b65a14 74%, #7c3509 100%);
    box-shadow: inset 0 -14px 18px rgba(60,20,0,.35), inset 0 10px 12px rgba(255,220,170,.25), 0 18px 30px rgba(90,35,0,.3); }
  .bottle::before { content: ""; position: absolute; left: 20px; top: 18px; width: 11px; height: 200px; border-radius: 8px; background: linear-gradient(180deg, rgba(255,245,225,.8), rgba(255,245,225,.05)); }
  .bottle::after { content: ""; position: absolute; right: 18px; top: 30px; width: 5px; height: 120px; border-radius: 4px; background: linear-gradient(180deg, rgba(255,235,200,.35), rgba(255,235,200,0)); }
  .label { position: absolute; left: 14px; right: 14px; top: 66px; height: 118px; border-radius: 4px; background: linear-gradient(90deg, #efe2c8, #fbf4e6 40%, #f3e7cf 80%, #e2d0ae);
    text-align: center; padding-top: 14px; color: #4a2412; }
  .label .b { font-size: 8px; letter-spacing: .3em; font-weight: 700; }
  .label .n { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-style: italic; line-height: 1.05; margin-top: 8px; }
  .label .s { font-size: 7px; letter-spacing: .22em; margin-top: 9px; color: #a85a1a; font-weight: 700; }
  .label .ml { font-size: 7px; letter-spacing: .2em; margin-top: 6px; color: #8a6a55; }
  .neck { position: absolute; width: 56px; height: 22px; border-radius: 4px 4px 0 0; background: linear-gradient(90deg, #7a5a1e, #e9cd84 30%, #fff1c2 45%, #c9a14b 65%, #6e4e16); }
  .neck::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 5px); }
  .bulb { position: absolute; width: 46px; height: 74px; border-radius: 23px 23px 6px 6px; background: linear-gradient(90deg, #1a0f0a, #4a3328 35%, #6a5044 45%, #2a1a12 70%, #120a06); }

  /* citrus slices */
  .citrus { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff6dc 0 8%, transparent 9%),
      repeating-conic-gradient(#f8b13c 0deg 33deg, #fff3d6 33deg 36deg),
      #f8b13c;
    box-shadow: 0 0 0 7px #fff3d6, 0 0 0 13px #ec8a1e, 0 14px 26px rgba(90,35,0,.3); }
  .citrus::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%); }
  .strand { position: absolute; width: 6px; height: 50px; border-radius: 3px 3px 50% 50%; background: linear-gradient(180deg, #ffb347, #c2410c 70%, #8f2a07); box-shadow: 0 2px 4px rgba(90,30,0,.3); }
  .drop { position: absolute; width: 22px; height: 30px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 35% 35%, #fff2d0, #f2a23a 50%, #b4561a); box-shadow: 0 6px 12px rgba(90,35,0,.3); }
</style>
</head>
<body>
<div class="card">
  <div class="panel"></div>
  <div class="frame"></div>

  <div class="top"><span class="mark"></span>KESAR <span class="amp">&amp;</span> CO.</div>

  <div class="copy">
    <span class="badge"><span class="star">★</span> Best-seller</span>
    <h1>Vitamin C<br><em>Serum</em></h1>
    <p class="sub">Kashmiri kesar meets 15% vitamin C for an everyday, lit-from-within glow.</p>
    <div class="rule"></div>
    <div class="price"><span class="was">₹899</span><span class="now"><span class="r">₹</span>629</span></div>
    <span class="save">30% off · Festive Sale</span>
  </div>

  <div class="foot">5 days only · <b>Shop now</b></div>

  <div class="citrus" style="left:640px; top:690px; width:150px; height:150px; transform: rotate(12deg)"></div>
  <div class="citrus" style="left:900px; top:250px; width:96px; height:96px; transform: rotate(-20deg)"></div>

  <div class="product">
    <div class="shadow" style="left:-110px; top:150px; width:220px; height:34px"></div>
    <div class="bulb" style="left:-23px; top:-188px"></div>
    <div class="neck" style="left:-28px; top:-114px"></div>
    <div class="bottle" style="left:-75px; top:-92px"><div class="label"><div class="b">KESAR &amp; CO.</div><div class="n">Vitamin C<br>Serum</div><div class="s">15% VIT C · KESAR</div><div class="ml">30 ML · 1 FL OZ</div></div></div>
  </div>

  <div class="strand" style="left:612px; top:470px; transform: rotate(-40deg)"></div>
  <div class="strand" style="left:960px; top:560px; transform: rotate(38deg); height:42px"></div>
  <div class="strand" style="left:940px; top:880px; transform: rotate(70deg)"></div>
  <div class="drop" style="left:672px; top:260px; transform: rotate(-12deg)"></div>
</div>
</body>
</html>
