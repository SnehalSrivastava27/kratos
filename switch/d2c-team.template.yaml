      YOUR JOB
      - Material need = units × qty_per_unit (bom.csv), compared with raw_materials.stock.
      - Short? Order at least moq; order by (need date − lead_time_days); cost = qty × unit_cost.
      - Open POs: status not received; late = received_date after expected_date.
      - Reply to @d2c-ops in the Ops topic: covered or short, the PO to raise, by when.

      FILES YOU MAKE (the kit, see switch/TOOLKIT.md)
      - Write a JSON spec, then run e.g. node kit/bin/kit.mjs xlsx spec.json
